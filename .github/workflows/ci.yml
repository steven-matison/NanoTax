name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck nanotax install.sh
      - name: bash -n
        run: bash -n nanotax && bash -n install.sh
      - name: python compiles
        run: python3 -m py_compile tools/ansi2svg.py

  smoke:
    # no Jetson and no Hailo on a hosted runner: every panel has to degrade cleanly
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: ./nanotax --version
      - name: loader screen
        run: ./nanotax --loader --color
      - name: full run, 2 s phases, GPU off
        run: NANOTAX_GPU=off ./nanotax -y 2
